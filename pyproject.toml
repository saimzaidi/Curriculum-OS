[project]
name = "curriculumos"
version = "0.1.0"
description = "Local, source-grounded curriculum planning vertical slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pypdf>=5,<6",
  "python-multipart>=0.0.9,<1",
  "ortools>=9.10,<10",
  "PyJWT>=2.10,<3",
  "turbovec==0.8.0",
]

[project.optional-dependencies]
rag-anything = [
  "raganything==1.3.1",
  "lightrag-hku[api]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
