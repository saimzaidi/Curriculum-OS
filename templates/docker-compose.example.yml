services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: curriculumos
      POSTGRES_USER: curriculumos
      POSTGRES_PASSWORD: curriculumos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      - postgres
      - minio
      - prefect
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

  worker:
    build: ./apps/api
    command: prefect worker start --pool curriculumos
    env_file: .env
    depends_on:
      - api
      - prefect

volumes:
  postgres_data:
  minio_data:
